{% extends 'mailings/base.html' %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h1>Сообщения</h1>
    <a class="btn btn-outline-light me-2" href="/message/create/">Добавить сообщение</a>
</div>
<div class="container">
  <div class="row align-items-center">
    {% for message in object_list %}
      <div class="col-md-4 mb-3">
        <div class="card text-white bg-dark" style="border: 2px solid gray;">
          <div class="card-body text-center">
              <div class="card-header">
                  <h5>Тема письма: {{ message.subject|truncatechars:13 }}</h5>
              </div>
            <div class="card-body">
                    <p>{{ message.message |truncatechars:50 }}</p>
                    <a href="/message/{{ message.id }}">
                        <button type="button" class="btn row btn-lg btn-block btn-outline-info btn-sm">Подробнее</button>
                    </a>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
